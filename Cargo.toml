[package]
name = "gpui-renderer"
version = "0.1.0"
edition = "2024"
description = "Ichiloto's standalone native presentation and keyboard surface"

[dependencies]
gpui = "=0.2.2"
async-channel = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
