[package]
name = "gpui-renderer"
version = "0.1.0"
edition = "2024"
description = "Ichiloto's standalone native presentation and keyboard surface"

[dependencies]
gpui = "=0.2.2"
cosmic-text = "=0.14.2"
swash = "=0.2.10"
async-channel = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3"
